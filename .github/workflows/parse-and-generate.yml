name: Columbus GovDelivery RSS scraper
run-name: "Download Stuff; build the OPML; generate RSS feed"
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 6' # Saturdays at noon, in whatever timezone Github uses
jobs:
  Download-and-Make:
    runs-on: ubuntu-slim
    steps:
      - run: echo "ℹ️ The job was triggered by a ${{ github.event_name }} event."
      - name: Check out this repo
        uses: actions/checkout@v7
      - run: echo "ℹ️ The ${{ github.repository }} repository has been cloned to the runner."
      - name: Install pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Install yq/xq
        run: |-
          python -m pip install -r requirements.txt
      - name: Create build directory
        run: mkdir -p build/
      - name: Test dependencies
        run: |-
          php --version
          xq --version
          awk --version
          curl --version
          sed --version
      - name: Fetch latest data from the API endpoint
        run: |-
          bash ./update.bash
      - name: "🛑 Preserve php errors"
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: php-error.log
          path: |
            ./php-error.log
      - name: "▶️ Commit and push if the data has changed"
        run: |-
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Latest scrape: ${timestamp}" || exit 0
          git push

